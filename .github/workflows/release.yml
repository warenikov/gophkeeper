# Релиз: сборка бинарников под все платформы и публикация в GitHub Releases при
# пуше тега вида vX.Y.Z. Ограничено тегами — не запускается на PR/ветках.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # требуется для создания GitHub Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

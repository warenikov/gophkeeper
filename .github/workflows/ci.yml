# CI: линтинг и тесты (включая интеграционные с PostgreSQL).
# Версии экшенов — актуальные мажорные на момент написания; при необходимости
# обновите до последних.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Go и golangci-lint зафиксированы совместимой парой: линтер v2.10.1
      # собран на go1.26, поэтому и тулчейн берём 1.26 — иначе укатившийся
      # вперёд "stable" (go1.27) ломает type-checking линтера. Тесты гоняются
      # отдельной матрицей (1.25/1.26/stable) для проверки совместимости.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
      - name: go vet
        run: go vet ./...
      - name: go mod tidy проверка
        run: go mod tidy && git diff --exit-code

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.26", "stable"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gophkeeper
          POSTGRES_PASSWORD: gophkeeper
          POSTGRES_DB: gophkeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gophkeeper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      GOPHKEEPER_TEST_DSN: postgres://gophkeeper:gophkeeper@localhost:5432/gophkeeper?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Тесты (race, shuffle, покрытие)
        run: >-
          go test -race -shuffle=on -count=1
          -covermode=atomic
          -coverpkg=$(go list ./... | grep -vE '/internal/pb|/cmd/' | paste -sd, -)
          -coverprofile=coverage.out ./...
      - name: Отчёт о покрытии
        run: go tool cover -func=coverage.out | tail -n 1

# Конфигурация golangci-lint v2 для GophKeeper.
# Проверка схемы: golangci-lint config verify
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod
  issues-exit-code: 1

linters:
  # default (standard) = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - revive
    - gosec
    - misspell
    - bodyclose
    - unconvert
    - unparam
    - gocritic
    - prealloc
    - nolintlint

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    staticcheck:
      checks:
        - all
        # ST1000 требует комментарий пакета вида «Package name ...» (на
        # английском). В проекте комментарии на русском — правило отключено.
        - "-ST1000"
    revive:
      severity: warning
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: context-as-argument
    misspell:
      locale: US
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    warn-unused: true
    rules:
      # В тестах допускаем неполную обработку ошибок и «магические» числа.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/warenik/gophkeeper

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

# Конфигурация GoReleaser: кросс-сборка клиента и сервера GophKeeper под
# Linux/macOS/Windows и публикация в GitHub Releases по тегу.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: client
    main: ./cmd/client
    binary: gophkeeper-client
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/warenik/gophkeeper/internal/buildmeta.Version={{.Version}}
      - -X github.com/warenik/gophkeeper/internal/buildmeta.BuildDate={{.Date}}
      - -X github.com/warenik/gophkeeper/internal/buildmeta.Commit={{.ShortCommit}}

  - id: server
    main: ./cmd/server
    binary: gophkeeper-server
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/warenik/gophkeeper/internal/buildmeta.Version={{.Version}}
      - -X github.com/warenik/gophkeeper/internal/buildmeta.BuildDate={{.Date}}
      - -X github.com/warenik/gophkeeper/internal/buildmeta.Commit={{.ShortCommit}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

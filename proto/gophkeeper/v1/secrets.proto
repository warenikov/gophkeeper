syntax = "proto3";

// Файл secrets.proto описывает хранение приватных записей пользователя.
// Полезная нагрузка (encrypted_payload) всегда зашифрована на клиенте — сервер
// её не расшифровывает (модель zero-knowledge).
package gophkeeper.v1;

option go_package = "github.com/warenik/gophkeeper/internal/pb;pb";

import "google/protobuf/timestamp.proto";

// SecretType — тип хранимой записи. В Спринте 1 поддержаны логин/пароль и текст;
// банковские карты и бинарные данные добавляются в Спринте 2.
enum SecretType {
  SECRET_TYPE_UNSPECIFIED = 0;
  SECRET_TYPE_LOGIN_PASSWORD = 1;
  SECRET_TYPE_TEXT = 2;
  SECRET_TYPE_CARD = 3;
  SECRET_TYPE_BINARY = 4;
}

// Secret — одна приватная запись владельца.
message Secret {
  string id = 1;
  SecretType type = 2;
  // name — человекочитаемая метка записи (не шифруется).
  string name = 3;
  // metadata — произвольная нечувствительная метаинформация (не шифруется).
  string metadata = 4;
  // encrypted_payload — полезная нагрузка, зашифрованная на клиенте.
  bytes encrypted_payload = 5;
  // version — версия записи для оптимистичной блокировки и синхронизации.
  int64 version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // deleted — тумбстон: запись удалена (для синхронизации клиентов).
  bool deleted = 9;
  // revision — монотонный курсор изменения записи.
  int64 revision = 10;
}

// CreateSecretRequest — создание новой записи.
message CreateSecretRequest {
  SecretType type = 1;
  string name = 2;
  string metadata = 3;
  bytes encrypted_payload = 4;
}

// GetSecretRequest — получение одной записи по идентификатору.
message GetSecretRequest {
  string id = 1;
}

// ListSecretsRequest — получение всех записей владельца.
message ListSecretsRequest {}

// ListSecretsResponse — список записей владельца.
message ListSecretsResponse {
  repeated Secret secrets = 1;
}

// UpdateSecretRequest — обновление записи. Поле version содержит ожидаемую
// текущую версию для контроля конфликтов (optimistic concurrency).
message UpdateSecretRequest {
  string id = 1;
  string name = 2;
  string metadata = 3;
  bytes encrypted_payload = 4;
  int64 version = 5;
}

// DeleteSecretRequest — удаление записи по идентификатору.
message DeleteSecretRequest {
  string id = 1;
}

// DeleteSecretResponse — пустой ответ на удаление.
message DeleteSecretResponse {}

// SyncRequest — запрос изменений начиная с указанного курсора-ревизии.
message SyncRequest {
  int64 since_revision = 1;
}

// SyncResponse — изменившиеся записи (включая тумбстоны) и новый курсор.
message SyncResponse {
  repeated Secret secrets = 1;
  int64 revision = 2;
}

// SecretsService — CRUD над приватными записями. Все методы требуют авторизации.
service SecretsService {
  rpc Create(CreateSecretRequest) returns (Secret);
  rpc List(ListSecretsRequest) returns (ListSecretsResponse);
  rpc Get(GetSecretRequest) returns (Secret);
  rpc Update(UpdateSecretRequest) returns (Secret);
  rpc Delete(DeleteSecretRequest) returns (DeleteSecretResponse);
  // Sync возвращает записи, изменившиеся с указанной ревизии (включая
  // тумбстоны), для синхронизации локального кэша клиента.
  rpc Sync(SyncRequest) returns (SyncResponse);
}
